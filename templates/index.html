<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>云付</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#F3F8FE;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    color:#172338;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.card{
    width:100%;
    max-width:420px;
    background:#FFFFFF;
    border-radius:28px;
    padding:40px 28px;
    box-shadow:0 20px 50px rgba(45,110,240,.08);
    border:1px solid #DCE8F4;
    text-align:center;
}

.logo{
    width:84px;
    height:84px;
    margin:0 auto 24px;
    border-radius:26px;
    background:#EAF2FF;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#2F6FED;
    font-size:42px;
    font-weight:700;
}

h1{
    margin:0;
    font-size:32px;
}

.subtitle{
    margin-top:10px;
    color:#738196;
    font-size:15px;
}

.welcome{
    margin-top:42px;
    font-size:25px;
    font-weight:700;
}

.desc{
    margin-top:10px;
    color:#8A97A8;
    font-size:14px;
}

button{
    width:100%;
    height:54px;
    margin-top:24px;
    border:none;
    border-radius:14px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

.login{
    background:#2F6FED;
    color:#FFFFFF;
}

.register{
    margin-top:14px;
    background:#EAF2FF;
    color:#2F6FED;
}

.note{
    margin-top:30px;
    color:#94A0AF;
    font-size:12px;
    line-height:1.7;
}
</style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="logo">云</div>

        <h1>云付</h1>

        <div class="subtitle">
            商户支付平台
        </div>

        <div class="welcome">
            欢迎使用云付
        </div>

        <div class="desc">
            收款、交易、结算，一站式管理
        </div>

        <button class="login"
                onclick="location.href='/登录'">
            登录
        </button>

        <button class="register"
                onclick="location.href='/注册'">
            注册
        </button>

        <div class="note">
            安全登录 · 数据保护 · 操作留痕
        </div>

    </div>

</div>

</body>
</html>
