<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>云付支付平台</title>

<style>

body{
    background:#f3f8ff;
    font-family:Arial;
    padding:20px;
}


.card{

    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 20px #dbe5f5;

}


h1{
    color:#1677ff;
}


.money{

    font-size:35px;
    color:#1677ff;

}


button{

    width:100%;
    height:45px;
    background:#1677ff;
    color:white;
    border:0;
    border-radius:10px;

}


.menu{

    margin-top:20px;
    display:grid;
    gap:15px;

}


.item{

    background:#eef5ff;
    padding:18px;
    border-radius:12px;

}


</style>

</head>


<body>


<div class="card">


<h1>
云付
</h1>


<p>
商户支付管理平台
</p>


<h3>
今日收款
</h3>


<div class="money">
¥0.00
</div>


<br>


<button>
进入收款中心
</button>



<div class="menu">


<div class="item">
📱 收款中心
</div>


<div class="item">
📄 交易记录
</div>


<div class="item">
🏢 商户认证
</div>


<div class="item">
⚙️ 账户设置
</div>


</div>


</div>


</body>


</html>
