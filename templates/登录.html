<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>商户登录</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#F3F8FE;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    color:#172338;
}

.page{
    min-height:100vh;
    padding:24px;
}

.card{
    width:100%;
    max-width:420px;
    margin:70px auto;
    background:#FFF;
    border:1px solid #DCE8F4;
    border-radius:26px;
    padding:30px 26px;
}

.back{
    color:#2F6FED;
    font-size:15px;
    text-decoration:none;
}

.logo{
    width:68px;
    height:68px;
    border-radius:22px;
    background:#EAF2FF;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#2F6FED;
    font-size:34px;
    font-weight:700;
    margin:30px auto 20px;
}

h1{
    text-align:center;
    font-size:28px;
    margin:0;
}

.sub{
    text-align:center;
    color:#738196;
    font-size:14px;
    margin:10px 0 30px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:8px;
    font-size:14px;
    font-weight:700;
}

input{
    width:100%;
    height:52px;
    border:1px solid #DCE7F2;
    border-radius:12px;
    padding:0 15px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#2F6FED;
}

button{
    width:100%;
    height:54px;
    border:0;
    border-radius:14px;
    background:#2F6FED;
    color:white;
    font-size:17px;
    font-weight:700;
    margin-top:28px;
}

.register{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2F6FED;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="page">

<div class="card">

<a class="back" href="/">‹ 返回</a>

<div class="logo">云</div>

<h1>商户登录</h1>

<div class="sub">
使用商户账号进入云付
</div>

<label>手机号</label>

<input
    type="tel"
    placeholder="请输入手机号"
>

<label>登录密码</label>

<input
    type="password"
    placeholder="请输入登录密码"
>

<button>
登录
</button>

<a class="register" href="/注册">
还没有商户账号？立即注册
</a>

</div>

</div>

</body>
</html>
