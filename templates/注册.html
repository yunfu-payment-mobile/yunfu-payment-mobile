<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>商户注册</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#F3F8FE;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    color:#172338;
}

.page{
    min-height:100vh;
    padding:24px;
}

.card{
    width:100%;
    max-width:420px;
    margin:40px auto;
    background:#FFF;
    border:1px solid #DCE8F4;
    border-radius:26px;
    padding:30px 26px;
}

.back{
    color:#2F6FED;
    text-decoration:none;
    font-size:15px;
}

h1{
    font-size:28px;
    margin:30px 0 8px;
}

.sub{
    color:#738196;
    font-size:14px;
    margin-bottom:28px;
}

label{
    display:block;
    margin:17px 0 8px;
    font-size:14px;
    font-weight:700;
}

input{
    width:100%;
    height:52px;
    border:1px solid #DCE7F2;
    border-radius:12px;
    padding:0 15px;
    font-size:15px;
    outline:none;
}

button{
    width:100%;
    height:54px;
    border:0;
    border-radius:14px;
    background:#2F6FED;
    color:#FFF;
    font-size:17px;
    font-weight:700;
    margin-top:26px;
}

.login{
    text-align:center;
    display:block;
    margin-top:18px;
    color:#2F6FED;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="page">

<div class="card">

<a class="back" href="/">‹ 返回</a>

<h1>商户注册</h1>

<div class="sub">
创建云付商户账号
</div>

<label>手机号码</label>

<input
    type="tel"
    placeholder="请输入手机号码"
>

<label>短信验证码</label>

<input
    type="text"
    placeholder="请输入验证码"
>

<label>登录密码</label>

<input
    type="password"
    placeholder="请输入登录密码"
>

<label>确认密码</label>

<input
    type="password"
    placeholder="请再次输入密码"
>

<button>
创建账号
</button>

<a class="login" href="/登录">
已有账号？返回登录
</a>

</div>

</div>

</body>
</html>
